<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Platzhalter für ein Persona-Foto">
  <!-- Neutraler Platzhalter (eigene Gestaltung). Nur Bilder verwenden, deren Nutzung erlaubt ist. -->
